name: gocover

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Set up Tinygo
      uses: acifani/setup-tinygo@v3

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Build WASM
      run: cd test && tinygo build -buildmode=wasi-legacy -target=wasi -opt=2 -gc=conservative -scheduler=none -o ../host-wazero/test.wasm module.go

    - name: Build WASM (Zig)
      run: make wasm-zig

    - name: Cover Host
      run: cd host-wazero && go test . -coverprofile coverage.out

    - name: Update Host coverage badge
      uses: ncruces/go-coverage-report@v0.3.1
      with:
        coverage-file: coverage.out
        module-dir: host-wazero
        output-dir: host-wazero
      continue-on-error: true
